# Updated : 2026.08.16
# Version : 1.2.0

blueprint:
  name: "Solis: Create/Edit Schedule"
  description: >
    Create or update a Solis inverter schedule slot via ESPHome.
    Configure the ESPHome action prefix to match your device
    (e.g. `solisinverter_inverter1` for the default hostname).
    Includes Auto-Pause on Target SOC and date-aware repeat modes.
  domain: script
  source_url: https://raw.githubusercontent.com/MrPabloUK/ESPhome-Solis-EH1/main/home_assistant/blueprints/solis_schedule_manager.yaml
  input:
    device_prefix:
      name: ESPHome Action Prefix
      description: >
        The prefix used for ESPHome actions in Home Assistant.
        Found under Developer Tools → Actions, search for `esphome`.
        For a device named `solisinverter` with inverter ID 1, this is
        `solisinverter_inverter1`.
      default: solisinverter_inverter1
      selector:
        text: {}

variables:
  _device_prefix: !input device_prefix

fields:
  slot_num:
    name: Slot Number
    description: Select slot (1-12). Slot 1 has the highest priority.
    required: true
    default: 1
    selector:
      number:
        min: 1
        max: 12
        mode: box
  op_mode:
    name: Operation Mode
    required: true
    default: '1'
    selector:
      select:
        options:
        - label: Charge
          value: '1'
        - label: Discharge
          value: '2'
  start_t:
    name: Start Time
    required: true
    default: 00:00:00
    selector:
      time: {}
  end_t:
    name: End Time
    required: true
    default: 00:00:00
    selector:
      time: {}
  target_soc:
    name: Target SOC
    description: Charge or discharge to this state of charge.
    required: true
    default: 100
    selector:
      number:
        min: 10
        max: 100
        unit_of_measurement: '%'
  limit_watts:
    name: Power Limit
    description: Set to 0 for unlimited power.
    required: true
    default: 0
    selector:
      number:
        min: 0
        max: 6000
        unit_of_measurement: W
  repeat_mode:
    name: Repeat Mode
    description: Daily, selected days, a single date, or an inclusive date range.
    required: true
    default: '0'
    selector:
      select:
        options:
        - label: Daily
          value: '0'
        - label: Selected days
          value: '1'
        - label: Once
          value: '2'
        - label: Date range
          value: '3'
  selected_days:
    name: Days
    description: Used when Repeat Mode is Selected days. Monday is bit 0.
    required: false
    default: []
    selector:
      select:
        multiple: true
        options:
        - label: Monday
          value: '0'
        - label: Tuesday
          value: '1'
        - label: Wednesday
          value: '2'
        - label: Thursday
          value: '3'
        - label: Friday
          value: '4'
        - label: Saturday
          value: '5'
        - label: Sunday
          value: '6'
  date_start:
    name: Start Date
    description: Required for Once and Date range (YYYY-MM-DD).
    required: false
    selector:
      date: {}
  date_end:
    name: End Date
    description: Required for Date range (inclusive).
    required: false
    selector:
      date: {}
  auto_pause:
    name: Auto Pause on Target
    description: >-
      Pause the slot once the SOC target is reached (confirmed for 30s).
      Daily, selected-days, and date-range slots resume at the end of the time
      window; once slots are deleted at the end of the time window.
    required: true
    default: false
    selector:
      boolean: {}

sequence:
- action: "esphome.{{ _device_prefix }}_upsert_schedule"
  data:
    Slot_Number: '{{ slot_num | int }}'
    Operation_Mode: '{{ op_mode | int }}'
    Start_Hour: '{{ start_t.split('':'')[0] | int }}'
    Start_Minute: '{{ start_t.split('':'')[1] | int }}'
    End_Hour: '{{ end_t.split('':'')[0] | int }}'
    End_Minute: '{{ end_t.split('':'')[1] | int }}'
    Target_SOC_Percent: '{{ target_soc | int }}'
    Power_Limit_Watts: '{{ limit_watts | int }}'
    Repeat_Daily: '{{ repeat_mode != ''2'' }}'
    Repeat_Mode: '{{ repeat_mode | int }}'
    Selected_Days: '{% set ns = namespace(mask=0) %}{% for d in selected_days | default([]) %}{% set ns.mask = ns.mask + (2 ** (d | int)) %}{% endfor %}{{ ns.mask }}'
    Date_Start: '{{ (date_start | replace(''-'', '''') | int) if date_start is defined and date_start else 0 }}'
    Date_End: '{{ (date_end | replace(''-'', '''') | int) if date_end is defined and date_end else 0 }}'
    Auto_Pause_On_Target: '{{ auto_pause }}'

mode: single
