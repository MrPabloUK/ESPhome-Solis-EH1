# Updated : 2026.08.16
# Version : 1.2.0

blueprint:
  name: "Solis: Delete All Schedules"
  description: >
    Permanently delete every Solis inverter schedule slot via ESPHome.
    Configure the ESPHome action prefix to match your device
    (e.g. `solisinverter_inverter1` for the default hostname).
  domain: script
  source_url: https://raw.githubusercontent.com/MrPabloUK/ESPhome-Solis-EH1/main/home_assistant/blueprints/solis_schedule_delete_all.yaml
  input:
    device_prefix:
      name: ESPHome Action Prefix
      description: >
        The prefix used for ESPHome actions in Home Assistant.
        Found under Developer Tools → Actions, search for `esphome`.
        For a device named `solisinverter` with inverter ID 1, this is
        `solisinverter_inverter1`.
      default: solisinverter_inverter1
      selector:
        text: {}

variables:
  _device_prefix: !input device_prefix

fields:
  confirm:
    name: Confirm delete all
    description: Must be enabled. This cannot be undone.
    required: true
    default: false
    selector:
      boolean: {}

sequence:
- condition: template
  value_template: '{{ confirm }}'
- action: "esphome.{{ _device_prefix }}_delete_all_schedules"

mode: single
