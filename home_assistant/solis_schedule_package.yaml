# Solis Schedule Manager — Home Assistant Package
# Updated : 2026.08.16
# Version : 1.2.0
#
# Installation:
#   1. Copy this file into your HA config/packages/ directory.
#   2. Add the following to your configuration.yaml (if not already present):
#        homeassistant:
#          packages: !include_dir_named packages
#   3. Restart Home Assistant.
#
# The package creates:
#   - sensor.solis_master_schedule  (trigger-based template sensor)
#   - script.solis_schedule_manager
#   - script.solis_schedule_slot_control
#   - script.solis_schedule_delete_all

template:
  - trigger:
      - trigger: event
        event_type: esphome.solis_inverter1_schedule_update
    sensor:
      - name: "Solis Master Schedule"
        unique_id: solis_master_schedule
        state: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        attributes:
          data: "{{ trigger.event.data.schedules | from_json }}"

script:
  solis_schedule_manager:
    alias: 'Solis: Create/Edit Schedule'
    icon: mdi:calendar-edit
    description: Create or update inverter schedule slots via ESPHome
    fields:
      slot_num:
        name: Slot Number
        description: Select slot (1-12). Slot 1 has the highest priority.
        required: true
        default: 1
        selector:
          number:
            min: 1
            max: 12
            mode: box
      op_mode:
        name: Operation Mode
        required: true
        default: '1'
        selector:
          select:
            options:
            - label: Charge
              value: '1'
            - label: Discharge
              value: '2'
      start_t:
        name: Start Time
        required: true
        default: 00:00:00
        selector:
          time: {}
      end_t:
        name: End Time
        required: true
        default: 00:00:00
        selector:
          time: {}
      target_soc:
        name: Target SOC to charge or discharge to.
        required: true
        default: 100
        selector:
          number:
            min: 10
            max: 100
            unit_of_measurement: '%'
      limit_watts:
        name: Power Limit
        description: Set to 0 for unlimited power.
        required: true
        default: 0
        selector:
          number:
            min: 0
            max: 6000
            unit_of_measurement: W
      repeat_mode:
        name: Repeat Mode
        description: Daily, selected days, a single date, or an inclusive date range.
        required: true
        default: '0'
        selector:
          select:
            options:
            - label: Daily
              value: '0'
            - label: Selected days
              value: '1'
            - label: Once
              value: '2'
            - label: Date range
              value: '3'
      selected_days:
        name: Days
        description: Used when Repeat Mode is Selected days. Monday is bit 0.
        required: false
        default: []
        selector:
          select:
            multiple: true
            options:
            - label: Monday
              value: '0'
            - label: Tuesday
              value: '1'
            - label: Wednesday
              value: '2'
            - label: Thursday
              value: '3'
            - label: Friday
              value: '4'
            - label: Saturday
              value: '5'
            - label: Sunday
              value: '6'
      date_start:
        name: Start Date
        description: Required for Once and Date range (YYYY-MM-DD).
        required: false
        selector:
          date: {}
      date_end:
        name: End Date
        description: Required for Date range (inclusive).
        required: false
        selector:
          date: {}
      auto_pause:
        name: Auto Pause on Target
        description: >-
          Pause the slot once the SOC target is reached (confirmed for 30s).
          Daily, selected-days, and date-range slots resume at the end of the time
          window; once slots are deleted at the end of the time window.
        required: true
        default: false
        selector:
          boolean: {}
    sequence:
    - action: esphome.solisinverter_inverter1_upsert_schedule
      data:
        Slot_Number: '{{ slot_num | int }}'
        Operation_Mode: '{{ op_mode | int }}'
        Start_Hour: '{{ start_t.split('':'')[0] | int }}'
        Start_Minute: '{{ start_t.split('':'')[1] | int }}'
        End_Hour: '{{ end_t.split('':'')[0] | int }}'
        End_Minute: '{{ end_t.split('':'')[1] | int }}'
        Target_SOC_Percent: '{{ target_soc | int }}'
        Power_Limit_Watts: '{{ limit_watts | int }}'
        Repeat_Daily: '{{ repeat_mode != ''2'' }}'
        Repeat_Mode: '{{ repeat_mode | int }}'
        Selected_Days: '{% set ns = namespace(mask=0) %}{% for d in selected_days | default([]) %}{% set ns.mask = ns.mask + (2 ** (d | int)) %}{% endfor %}{{ ns.mask }}'
        Date_Start: '{{ (date_start | replace(''-'', '''') | int) if date_start is defined and date_start else 0 }}'
        Date_End: '{{ (date_end | replace(''-'', '''') | int) if date_end is defined and date_end else 0 }}'
        Auto_Pause_On_Target: '{{ auto_pause }}'
    mode: single

  solis_schedule_slot_control:
    alias: 'Solis: Schedule Slot Control'
    icon: mdi:list-status
    description: Pause, resume, or delete an inverter schedule slot via ESPHome
    fields:
      action_type:
        name: Action
        required: true
        default: reactivate
        selector:
          select:
            options:
            - label: Resume
              value: reactivate
            - label: Pause
              value: disable
            - label: Delete
              value: delete
      slot_num:
        name: Slot Number
        required: true
        default: 1
        selector:
          number:
            min: 1
            max: 12
            mode: box
    sequence:
    - action: esphome.solisinverter_inverter1_manage_slot_status
      data:
        Slot_Number: '{{ slot_num | int }}'
        Instruction: '{% set mapper = {''delete'': 0, ''disable'': 1, ''reactivate'':
          2} %} {{ mapper[action_type] }}'
    mode: single

  solis_schedule_delete_all:
    alias: 'Solis: Delete All Schedules'
    icon: mdi:calendar-remove
    description: Permanently delete every inverter schedule slot
    fields:
      confirm:
        name: Confirm delete all
        description: Must be enabled. This cannot be undone.
        required: true
        default: false
        selector:
          boolean: {}
    sequence:
    - condition: template
      value_template: '{{ confirm }}'
    - action: esphome.solisinverter_inverter1_delete_all_schedules
    mode: single
