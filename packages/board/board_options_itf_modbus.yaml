# Requires ESPHome 2026.7 or later (stock uart / modbus / modbus_controller).

substitutions:
  # UART
  modbus_baud_rate: '9600' # 9600 / 19200 / 115200
  # Modbus
  modbus_send_wait_time: '150ms' # Timeout: max time to wait for the FIRST byte of a response
  modbus_turnaround_time: '125ms' # Pause after a completed response before the next command

uart:
  - id: !extend ${modbus_uart_id}
    baud_rate: ${modbus_baud_rate}

modbus:
  - uart_id: ${modbus_uart_id}
    id: ${modbus_id}
    role: ${modbus_role}
    send_wait_time: ${modbus_send_wait_time}
    turnaround_time: ${modbus_turnaround_time}
