# Updated : 2026.08.16
# Version : 1.2.3
# GitHub  : https://github.com/MrPabloUK/ESPhome-Solis-EH1
#
# Changelog:
#   1.2.3 - Add push_schedules API action so HA can request a snapshot after setup.
#   1.2.2 - Send schedule JSON as event data, not a Home Assistant template.
#   1.2.1 - Skip holding-register polls most cycles so 1s input-register
#           reads are not queued twice (ESPHome duplicate command warnings).
#   1.2.0 - Date-aware slots: daily, selected days, once, and date range.
#           Overnight windows use the start-day as the date/day-of-week anchor.
#           Logic is covered by tests/test_date_aware_schedule.py.
#           Added delete-all-schedules API action.
#   1.1.0 - Added Auto Pause on Target SOC reached (per-slot option).
#           When enabled, a slot auto-pauses after 30s of the SOC target
#           being met. Repeating slots auto-reactivate at window end;
#           non-repeating slots are deleted at window end.

