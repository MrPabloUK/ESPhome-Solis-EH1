modbus_controller:
  # Input ranges stream continuously; update_interval is recovery only.
  # Holding stays 10s one-shot so status/config/RTC do not fill the bus.
  - id: inverter${inverter_id}_modbus_controller
    modbus_id: ${inverter_modbus_id}
    address: ${inverter_modbus_address}
    update_interval: ${inverter_update_interval}
    continuous: true
    setup_priority: -10
    max_cmd_retries: 4
    # 5s re-arm; skip 1 => probe every ~10s when offline (was ~11s at 1s/skip 10)
    offline_skip_updates: 1
  - id: inverter${inverter_id}_modbus_holding
    modbus_id: ${inverter_modbus_id}
    address: ${inverter_modbus_address}
    update_interval: 10s
    setup_priority: -10
    max_cmd_retries: 1
    # skip 1 => probe every ~20s (was ~110s at skip 10)
    offline_skip_updates: 1

modbus_client:
  - id: inverter${inverter_id}_modbus_client
    modbus_id: ${inverter_modbus_id}
    address: ${inverter_modbus_address}

packages:
  inverter_sensors: !include inverter_solis_eh1_sensors.yaml
  inverter_controls: !include inverter_solis_eh1_controls.yaml
  inverter_rtc: !include inverter_solis_eh1_rtc.yaml
  inverter_schedule: !include inverter_solis_eh1_smart_schedule.yaml
  inverter_base: !include inverter_base.yaml
