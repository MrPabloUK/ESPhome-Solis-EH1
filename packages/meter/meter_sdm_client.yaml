esphome:
  devices:
    - id: device_${meter_id}
      name: "${meter_name}"

modbus_controller:
  - id: sdm_${meter_id}
    modbus_id: ${meter_modbus_id}
    address: ${meter_address}
    continuous: true
    update_interval: 15s
    max_cmd_retries: 1
    offline_skip_updates: 3

sensor:
  - platform: modbus_controller
    modbus_controller_id: sdm_${meter_id}
    device_id: device_${meter_id}
    name: "${meter_name} Voltage"
    address: 0x0000
    register_type: read
    value_type: FP32
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: sdm_${meter_id}
    device_id: device_${meter_id}
    name: "${meter_name} Current"
    address: 0x0006
    register_type: read
    value_type: FP32
    reuse_previous_range: true
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: sdm_${meter_id}
    device_id: device_${meter_id}
    name: "${meter_name} Power"
    address: 0x000C
    register_type: read
    value_type: FP32
    reuse_previous_range: true
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: sdm_${meter_id}
    device_id: device_${meter_id}
    name: "${meter_name} Apparent Power"
    address: 0x0012
    register_type: read
    value_type: FP32
    reuse_previous_range: true
    unit_of_measurement: VA
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: sdm_${meter_id}
    device_id: device_${meter_id}
    name: "${meter_name} Reactive Power"
    address: 0x0018
    register_type: read
    value_type: FP32
    reuse_previous_range: true
    unit_of_measurement: var
    device_class: reactive_power
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: sdm_${meter_id}
    device_id: device_${meter_id}
    name: "${meter_name} Power Factor"
    address: 0x001E
    register_type: read
    value_type: FP32
    reuse_previous_range: true
    device_class: power_factor
    state_class: measurement
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: sdm_${meter_id}
    device_id: device_${meter_id}
    name: "${meter_name} Phase Angle"
    address: 0x0024
    register_type: read
    value_type: FP32
    reuse_previous_range: true
    unit_of_measurement: "°"
    state_class: measurement
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: sdm_${meter_id}
    device_id: device_${meter_id}
    name: "${meter_name} Frequency"
    address: 0x0046
    register_type: read
    value_type: FP32
    reuse_previous_range: true
    unit_of_measurement: Hz
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: sdm_${meter_id}
    device_id: device_${meter_id}
    name: "${meter_name} Total Energy"
    address: 0x0048
    register_type: read
    value_type: FP32
    reuse_previous_range: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
