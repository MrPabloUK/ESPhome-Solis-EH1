esphome:
  devices:
    - id: device_${meter_id}
      name: "${meter_name}"

modbus_controller:
  - id: meter_${meter_id}
    modbus_id: ${meter_modbus_id}
    address: ${meter_address}
    update_interval: 1s
    max_cmd_retries: 1
    offline_skip_updates: 3

sensor:
  - platform: modbus_controller
    id: ${meter_id}_total_energy_raw
    modbus_controller_id: meter_${meter_id}
    internal: true
    register_type: holding
    address: 0
    value_type: S_DWORD

  - platform: modbus_controller
    id: ${meter_id}_voltage_raw
    modbus_controller_id: meter_${meter_id}
    internal: true
    register_type: holding
    address: 11
    value_type: U_WORD
    reuse_previous_range: true

  - platform: modbus_controller
    id: ${meter_id}_current_raw
    modbus_controller_id: meter_${meter_id}
    internal: true
    register_type: holding
    address: 12
    value_type: U_WORD
    reuse_previous_range: true

  - platform: modbus_controller
    id: ${meter_id}_power_raw
    modbus_controller_id: meter_${meter_id}
    internal: true
    register_type: holding
    address: 13
    value_type: S_WORD
    reuse_previous_range: true

  - platform: modbus_controller
    id: ${meter_id}_reactive_raw
    modbus_controller_id: meter_${meter_id}
    internal: true
    register_type: holding
    address: 14
    value_type: S_WORD
    reuse_previous_range: true

  - platform: modbus_controller
    id: ${meter_id}_apparent_raw
    modbus_controller_id: meter_${meter_id}
    internal: true
    register_type: holding
    address: 15
    value_type: S_WORD
    reuse_previous_range: true

  - platform: modbus_controller
    id: ${meter_id}_power_factor_raw
    modbus_controller_id: meter_${meter_id}
    internal: true
    register_type: holding
    address: 16
    value_type: S_WORD
    reuse_previous_range: true

  - platform: modbus_controller
    id: ${meter_id}_frequency_raw
    modbus_controller_id: meter_${meter_id}
    internal: true
    register_type: holding
    address: 17
    value_type: U_WORD
    reuse_previous_range: true

  - platform: modbus_controller
    id: ${meter_id}_import_energy_raw
    modbus_controller_id: meter_${meter_id}
    internal: true
    register_type: holding
    address: 60
    value_type: S_DWORD
    reuse_previous_range: true

  - platform: modbus_controller
    id: ${meter_id}_export_energy_raw
    modbus_controller_id: meter_${meter_id}
    internal: true
    register_type: holding
    address: 62
    value_type: S_DWORD
    reuse_previous_range: true

  - platform: modbus_controller
    id: ${meter_id}_status_64_raw
    modbus_controller_id: meter_${meter_id}
    internal: true
    register_type: holding
    address: 64
    value_type: U_WORD
    reuse_previous_range: true

  - platform: template
    device_id: device_${meter_id}
    name: "${meter_name} Voltage"
    update_interval: 1s
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      if (isnan(id(${meter_id}_voltage_raw).state)) return {};
      return id(${meter_id}_voltage_raw).state * 0.1;

  - platform: template
    device_id: device_${meter_id}
    name: "${meter_name} Current"
    update_interval: 1s
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    lambda: |-
      if (isnan(id(${meter_id}_current_raw).state)) return {};
      return id(${meter_id}_current_raw).state * 0.01;

  - platform: template
    device_id: device_${meter_id}
    name: "${meter_name} Power"
    update_interval: 1s
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      if (isnan(id(${meter_id}_power_raw).state)) return {};
      return -id(${meter_id}_power_raw).state;

  - platform: template
    device_id: device_${meter_id}
    name: "${meter_name} Reactive Power"
    update_interval: 1s
    unit_of_measurement: var
    device_class: reactive_power
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      if (isnan(id(${meter_id}_reactive_raw).state)) return {};
      return id(${meter_id}_reactive_raw).state;

  - platform: template
    device_id: device_${meter_id}
    name: "${meter_name} Apparent Power"
    update_interval: 1s
    unit_of_measurement: VA
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      if (isnan(id(${meter_id}_apparent_raw).state)) return {};
      return id(${meter_id}_apparent_raw).state;

  - platform: template
    device_id: device_${meter_id}
    name: "${meter_name} Power Factor"
    update_interval: 1s
    device_class: power_factor
    state_class: measurement
    accuracy_decimals: 2
    lambda: |-
      if (isnan(id(${meter_id}_power_factor_raw).state)) return {};
      return id(${meter_id}_power_factor_raw).state * 0.01;

  - platform: template
    device_id: device_${meter_id}
    name: "${meter_name} Frequency"
    update_interval: 1s
    unit_of_measurement: Hz
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    lambda: |-
      if (isnan(id(${meter_id}_frequency_raw).state)) return {};
      return id(${meter_id}_frequency_raw).state * 0.01;

  - platform: template
    device_id: device_${meter_id}
    name: "${meter_name} Import Energy"
    update_interval: 1s
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
    lambda: |-
      if (isnan(id(${meter_id}_import_energy_raw).state)) return {};
      return id(${meter_id}_import_energy_raw).state * 0.01;

  - platform: template
    device_id: device_${meter_id}
    name: "${meter_name} Export Energy"
    update_interval: 1s
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
    lambda: |-
      if (isnan(id(${meter_id}_export_energy_raw).state)) return {};
      return id(${meter_id}_export_energy_raw).state * 0.01;
