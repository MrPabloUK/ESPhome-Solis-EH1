# The Modbus interface package adds these keys to every hub. ESPHome rejects
# them when role is server (esphome/esphome#11969).
modbus:
  - id: !extend ${inverter_meter_modbus_id}
    send_wait_time: !remove
    turnaround_time: !remove

number:
  - platform: template
    name: "${meter_name} Inverter power bias"
    id: ${meter_id}_power_bias
    device_id: device_${meter_id}
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -2000
    max_value: 2000
    step: 1
    unit_of_measurement: W
    mode: box

modbus_server:
  - id: solis_meter_${meter_id}
    modbus_id: ${inverter_meter_modbus_id}
    address: 1
    courtesy_response:
      enabled: true
      register_last_address: 64
      register_value: 0
    registers:
      # Fixed words from a listen of the real ACR10R reply to 01 03 00 00 00 41.
      # Courtesy zeros cover every other address through 64.
      - address: 0
        value_type: S_DWORD
        read_lambda: |-
          if (isnan(id(${meter_id}_total_energy_raw).state)) return {};
          return (int32_t) id(${meter_id}_total_energy_raw).state;
      - address: 10
        value_type: U_WORD
        read_lambda: 'return 0x0001;'
      - address: 11
        value_type: U_WORD
        read_lambda: |-
          if (isnan(id(${meter_id}_voltage_raw).state)) return {};
          return (uint16_t) id(${meter_id}_voltage_raw).state;
      - address: 12
        value_type: U_WORD
        read_lambda: |-
          if (isnan(id(${meter_id}_current_raw).state)) return {};
          return (uint16_t) id(${meter_id}_current_raw).state;
      - address: 13
        value_type: S_WORD
        read_lambda: |-
          if (isnan(id(${meter_id}_power_raw).state)) return {};
          float sent = id(${meter_id}_power_raw).state - id(${meter_id}_power_bias).state;
          if (sent > 32767) sent = 32767;
          if (sent < -32768) sent = -32768;
          return (int16_t) sent;
      - address: 14
        value_type: S_WORD
        read_lambda: |-
          if (isnan(id(${meter_id}_reactive_raw).state)) return {};
          return (int16_t) id(${meter_id}_reactive_raw).state;
      - address: 15
        value_type: S_WORD
        read_lambda: |-
          if (isnan(id(${meter_id}_apparent_raw).state)) return {};
          return (int16_t) id(${meter_id}_apparent_raw).state;
      - address: 16
        value_type: S_WORD
        read_lambda: |-
          if (isnan(id(${meter_id}_power_factor_raw).state)) return {};
          return (int16_t) id(${meter_id}_power_factor_raw).state;
      - address: 17
        value_type: U_WORD
        read_lambda: |-
          if (isnan(id(${meter_id}_frequency_raw).state)) return {};
          return (uint16_t) id(${meter_id}_frequency_raw).state;
      - address: 21
        value_type: U_WORD
        read_lambda: 'return 0x0101;'
      - address: 34
        value_type: U_WORD
        read_lambda: 'return 0x0001;'
      - address: 35
        value_type: U_WORD
        read_lambda: 'return 0x0001;'
      - address: 60
        value_type: S_DWORD
        read_lambda: |-
          if (isnan(id(${meter_id}_import_energy_raw).state)) return {};
          return (int32_t) id(${meter_id}_import_energy_raw).state;
      - address: 62
        value_type: S_DWORD
        read_lambda: |-
          if (isnan(id(${meter_id}_export_energy_raw).state)) return {};
          return (int32_t) id(${meter_id}_export_energy_raw).state;
      - address: 64
        value_type: U_WORD
        read_lambda: |-
          if (isnan(id(${meter_id}_status_64_raw).state)) return 0x0007;
          return (uint16_t) id(${meter_id}_status_64_raw).state;

sensor:
  - platform: template
    device_id: device_${meter_id}
    name: "${meter_name} Power Sent"
    update_interval: 1s
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      if (isnan(id(${meter_id}_power_raw).state)) return {};
      float sent = id(${meter_id}_power_raw).state - id(${meter_id}_power_bias).state;
      if (sent > 32767) sent = 32767;
      if (sent < -32768) sent = -32768;
      return -sent;
